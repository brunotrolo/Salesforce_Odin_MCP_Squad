  - definir as regras de qualidade dos campos
  - como ficam os relacionamentos entre caso, conta e contato
  - planejar a carga e a volumetria de dados
  - documentar o mapeamento de campos por domínio
  - revisar o modelo contra os limites da plataforma
  - gerar o dicionário de dados da capacidade
  - validar o modelo com o time antes do build
