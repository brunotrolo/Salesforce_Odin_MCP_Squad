descricao: Desenha o modelo de dados e o contrato de dados da solução Salesforce. Objetos, campos, relacionamentos, glossário, volumetria e regras de qualidade.
intencoes:
  - desenhar o modelo de dados da solução
  - definir objetos, campos e relacionamentos
