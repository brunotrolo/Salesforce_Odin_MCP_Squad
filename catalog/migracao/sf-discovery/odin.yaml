id: sf-discovery
nome: Discovery-to-Backlog
dominio: salesforce
dono: mantenedor
descricao: Transforma entrevistas, transcrições e documentos do negócio em backlog rastreável, com critérios de aceite e regras de negócio com fonte, e publica as histórias no Jira.
intencoes:
  - transformar a transcrição da reunião em backlog
  - fazer o discovery com o cliente e levantar requisitos
  - escrever as histórias de usuário com critérios de aceite
  - levantar as regras de negócio que o negócio quer
  - publicar o backlog no Jira
  - priorizar as capacidades do produto
  - preparar o material de discovery para a PO
  - gerar épicos e histórias a partir da entrevista
  - texto: escrever a spec técnica da jornada
