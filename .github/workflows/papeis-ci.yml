name: papeis-ci
# Troca o papel Owner da conta de serviço do CI por papéis mínimos, só os que o Terraform e a homologação usam.
# Só o mantenedor, só na main. Idempotente: pode rodar de novo para acrescentar um papel que faltar (a conta mantém
# projectIamAdmin, então consegue se corrigir sozinha sem o Owner). `reduzir` = REDUZIR-OWNER remove o Owner; vazio só garante os papéis.
on:
  workflow_dispatch:
    inputs:
      reduzir:
        description: "Digite REDUZIR-OWNER para remover o papel Owner (vazio = só garante os papéis mínimos)"
        required: false
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: infra
  cancel-in-progress: false
jobs:
  papeis:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJETO: salesforcemcpodin
      CONTA: sa-ci-infra@salesforcemcpodin.iam.gserviceaccount.com
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/177809673592/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: sa-ci-infra@salesforcemcpodin.iam.gserviceaccount.com
      - name: Garantir os papéis mínimos
        run: |
          for R in \
            roles/serviceusage.serviceUsageAdmin roles/iam.serviceAccountAdmin roles/iam.serviceAccountUser roles/iam.roleAdmin \
            roles/resourcemanager.projectIamAdmin roles/cloudkms.admin roles/cloudkms.signerVerifier roles/cloudkms.publicKeyViewer \
            roles/storage.admin roles/secretmanager.admin roles/run.admin roles/pubsub.admin roles/cloudscheduler.admin \
            roles/datastore.owner roles/artifactregistry.admin roles/logging.viewer roles/aiplatform.user roles/bigquery.admin roles/monitoring.admin roles/logging.configWriter; do
            gcloud projects add-iam-policy-binding "$PROJETO" --member="serviceAccount:$CONTA" --role="$R" --condition=None --quiet >/dev/null
            echo "ok $R"
          done
      - name: Remover o Owner
        if: inputs.reduzir == 'REDUZIR-OWNER'
        run: |
          gcloud projects remove-iam-policy-binding "$PROJETO" --member="serviceAccount:$CONTA" --role=roles/owner --condition=None --quiet >/dev/null
          echo "Owner removido de $CONTA"
      - name: Papéis atuais da conta
        run: |
          gcloud projects get-iam-policy "$PROJETO" --flatten="bindings[].members" --filter="bindings.members:serviceAccount:$CONTA" --format="value(bindings.role)" | sort
