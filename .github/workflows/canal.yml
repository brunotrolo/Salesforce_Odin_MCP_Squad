name: canal
# Rollback do canal stable de uma skill (para a versão anterior ou uma escolhida). Só o mantenedor, só na main.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Id da skill (ex.: sf-test)"
        required: true
      versao:
        description: "Versão de destino (vazio = a anterior)"
        required: false
        default: ""
permissions:
  contents: read
  id-token: write
concurrency:
  group: canal
  cancel-in-progress: false
jobs:
  canal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJETO: salesforcemcpodin
      REGIAO: southamerica-east1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/177809673592/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: sa-ci-infra@salesforcemcpodin.iam.gserviceaccount.com
      - run: npm ci --ignore-scripts
      - name: Rollback
        env:
          SKILL: ${{ inputs.skill }}
          VERSAO: ${{ inputs.versao }}
        run: |
          PROJECT_ID=$PROJETO BUCKET_PACOTES=${PROJETO}-bundles node scripts/canal.ts rollback "$SKILL" "$VERSAO"
