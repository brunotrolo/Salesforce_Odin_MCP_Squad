name: publicar-skills
# Publica as skills reais (repositórios públicos clonados aqui) na nuvem, em rascunho, assinadas pelo KMS.
# Só o mantenedor, só na main (identidade federada). O Data Architect é privado e fica de fora até haver acesso.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: publicar-skills
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJETO: salesforcemcpodin
      REGIAO: southamerica-east1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/177809673592/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: sa-ci-infra@salesforcemcpodin.iam.gserviceaccount.com
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Data_Architect
          path: repos/Salesforce_Data_Architect
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
        continue-on-error: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Test_Automator
          path: repos/Salesforce_Test_Automator
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Discovery-to-Backlog
          path: repos/Salesforce_Discovery-to-Backlog
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Journey_Designer
          path: repos/Salesforce_Journey_Designer
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Journey_Developer
          path: repos/Salesforce_Journey_Developer
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Apex_Callouts_Developer
          path: repos/Salesforce_Apex_Callouts_Developer
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Apex-Cover-Loop
          path: repos/Salesforce_Apex-Cover-Loop
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Deep_Debugger
          path: repos/Salesforce_Deep_Debugger
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_Archaeologist
          path: repos/Salesforce_Archaeologist
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brunotrolo/Salesforce_LWC-Developer
          path: repos/Salesforce_LWC-Developer
          persist-credentials: false
          token: ${{ secrets.SKILLS_READ_TOKEN || github.token }}
      - run: npm ci --ignore-scripts
      - name: Publicar
        run: |
          NUM=177809673592
          echo "PROJECT_ID=$PROJETO" >> "$GITHUB_ENV"
          echo "BUCKET_PACOTES=${PROJETO}-bundles" >> "$GITHUB_ENV"
          echo "CHAVE_PACOTES=projects/$PROJETO/locations/$REGIAO/keyRings/odin/cryptoKeys/bundle-signing" >> "$GITHUB_ENV"
          echo "CHAVE_CLI=projects/$PROJETO/locations/$REGIAO/keyRings/odin/cryptoKeys/cli-signing" >> "$GITHUB_ENV"
          echo "ODIN_REPOS=$PWD/repos" >> "$GITHUB_ENV"
          echo "URL_EXECUCAO=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - run: node scripts/publicar-cli.ts
      - run: node scripts/publicar-skills.ts
