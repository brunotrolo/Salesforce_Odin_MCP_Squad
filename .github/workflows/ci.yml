name: ci
# Verificações do repositório Odin: testes dos scripts e do hook (Linux e Windows), documentação,
# skills, agentes e conformidade; em PR, documento protegido alterado exige ADR no mesmo conjunto.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
      - name: Testes (scripts, hook, ADR, verificações)
        run: npm test
      - name: Documentação, skills e conformidade
        run: npm run verificar
      - name: ADR obrigatório para documentos protegidos
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: node scripts/verificar-docs.mjs --base origin/${{ github.base_ref }}
