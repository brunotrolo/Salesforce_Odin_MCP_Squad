name: ci
# Verificações do repositório Odin: testes dos scripts e do hook (Linux e Windows), documentação,
# skills, agentes, contratos (schemas/) e conformidade de segurança e de custo; em PR, documento
# protegido alterado exige ADR no mesmo conjunto.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'   # laço contínuo: reverifica o projeto a cada 6 horas (testes, documentos, skills, conformidade)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # minutos do GitHub Free
jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Dependências (só de desenvolvimento, pelo lockfile, sem scripts de instalação)
        run: npm ci --ignore-scripts
      - name: Testes (scripts, hook, ADR, verificações, contratos)
        run: npm test
      - name: Documentação, skills, contratos e conformidade
        run: npm run verificar
      - name: ADR obrigatório para documentos protegidos
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: node scripts/verificar-docs.mjs --base origin/${{ github.base_ref }}
